name: Mise a jour calendrier Fortnite

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: node scripts/update-fortnite-events.js
      - name: Publier le calendrier si necessaire
        run: |
          if git diff --quiet -- public/fortnite-events.json; then exit 0; fi
          git config user.name "Fayzen Calendar Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/fortnite-events.json
          git commit -m "Mise a jour automatique des cups Fortnite [skip ci]"
          git push
